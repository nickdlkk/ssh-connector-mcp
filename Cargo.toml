[package]
name = "ssh-connector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.32"
getrandom = "0.4.2"
hmac = "0.12.1"
httpdate = "1.0.3"
rmcp = { version = "1.7.0", features = ["server", "transport-streamable-http-server", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
russh = "0.61.2"
russh-sftp = "2.3.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
vt100 = "0.16.2"
zeroize = { version = "1.8.2", features = ["derive"] }
