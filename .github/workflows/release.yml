name: Release binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
            binary: ssh-connector
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
            binary: ssh-connector.exe
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            binary: ssh-connector
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            binary: ssh-connector

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          staging="ssh-connector-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp README.md README.zh-CN.md LICENSE* "$staging/" 2>/dev/null || true
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $staging = "ssh-connector-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "$staging\"
          Copy-Item README.md,README.zh-CN.md -Destination "$staging\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$staging\*" -DestinationPath "$staging.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-connector-${{ matrix.target }}
          path: |
            ssh-connector-*.tar.gz
            ssh-connector-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ssh-connector-*
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum ssh-connector-* > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
